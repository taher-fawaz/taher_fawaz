name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Read-only token; the workflow needs no secrets. Vercel deploys through its own Git integration.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # No Sanity variables on purpose: the build uses the local fallback content, so CI needs no secrets
      # and never touches the CMS.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
