<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img">
  <title>Data flow: commands go from View to Service; data comes back as state</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0 0L10 5L0 10z" fill="#11171a"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f4d3a"/></marker>
  </defs>
  <rect width="1200" height="480" fill="#f6f1e7"/>
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" text-anchor="middle">
    <rect x="40" y="110" width="220" height="130" fill="#ede6d6" stroke="#11171a" stroke-width="2"/>
    <text x="150" y="168" font-size="24" font-weight="700" fill="#11171a">View</text>
    <text x="150" y="200" font-size="15" fill="#4a5654">Widgets</text>
    <rect x="340" y="110" width="220" height="130" fill="#ede6d6" stroke="#11171a" stroke-width="2"/>
    <text x="450" y="168" font-size="24" font-weight="700" fill="#11171a">ViewModel</text>
    <text x="450" y="200" font-size="15" fill="#4a5654">UI state</text>
    <rect x="640" y="110" width="220" height="130" fill="#1f4d3a" stroke="#1f4d3a" stroke-width="2"/>
    <text x="750" y="168" font-size="24" font-weight="700" fill="#f6f1e7">Repository</text>
    <text x="750" y="200" font-size="15" fill="#f6f1e7">source of truth</text>
    <rect x="940" y="110" width="220" height="130" fill="#ede6d6" stroke="#11171a" stroke-width="2"/>
    <text x="1050" y="168" font-size="24" font-weight="700" fill="#11171a">Service</text>
    <text x="1050" y="200" font-size="15" fill="#4a5654">API / file</text>

    <path d="M262 150H334" stroke="#11171a" stroke-width="3" marker-end="url(#a)"/>
    <path d="M562 150H634" stroke="#11171a" stroke-width="3" marker-end="url(#a)"/>
    <path d="M862 150H934" stroke="#11171a" stroke-width="3" marker-end="url(#a)"/>
    <path d="M938 205H864" stroke="#1f4d3a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#b)"/>
    <path d="M638 205H564" stroke="#1f4d3a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#b)"/>
    <path d="M338 205H264" stroke="#1f4d3a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#b)"/>

    <path d="M340 340H420" stroke="#11171a" stroke-width="3" marker-end="url(#a)"/>
    <text x="440" y="346" font-size="18" text-anchor="start" fill="#11171a">commands</text>
    <path d="M700 340H780" stroke="#1f4d3a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#b)"/>
    <text x="800" y="346" font-size="18" text-anchor="start" fill="#11171a">data and state</text>
  </g>
</svg>
